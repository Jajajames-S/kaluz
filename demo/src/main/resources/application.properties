spring.application.name=kaluz
server.port=${PORT:8080}

# Carga opcional de un archivo .env local (ver .env.example). En produccion usa variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos (Supabase / PostgreSQL) ---
spring.datasource.url=postgresql://postgres.tiigfjwqbaqoyfmsjwsx:[YOUR-PASSWORD]@aws-1-us-west-2.pooler.supabase.com:5432/postgres
spring.datasource.username=tiigfjwqbaqoyfmsjwsx
spring.datasource.password=21012005Ryuko.
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: el pooler de Supabase tiene limite de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# El esquema se crea ejecutando db/schema.sql en Supabase (no con Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Reglas de negocio ---
kaluz.comision.porcentaje=0.05
kaluz.documentos.dias-alerta=15
kaluz.cors.origins=${CORS_ORIGINS:http://localhost:4200}
